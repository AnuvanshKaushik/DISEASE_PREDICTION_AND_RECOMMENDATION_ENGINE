services:
  - type: web
    name: disease-prediction-and-recommendation
    runtime: python
    plan: free
    buildCommand: python -m pip install --upgrade pip && pip install -r ml_service/requirements.txt
    startCommand: gunicorn --chdir ml_service --workers 1 --threads 2 --timeout 240 --bind 0.0.0.0:${PORT:-10000} app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CUDA_VISIBLE_DEVICES
        value: "-1"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
